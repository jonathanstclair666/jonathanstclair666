<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>📸 My Photo Collection</h1>
        <p>Beautiful moments captured in time</p>
        
        <!-- Theme Toggle -->
        <div class="theme-toggle">
            <i class="fas fa-moon"></i>
            <span class="toggle-switch"></span>
            <i class="fas fa-sun"></i>
        </div>

        <!-- Upload Button -->
        <div class="upload-container">
            <label for="fileInput" class="upload-btn">
                <i class="fas fa-cloud-upload-alt"></i> Upload Photo
            </label>
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
        </div>
        
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Search photos...">
        </div>

        <!-- Category Buttons -->
        <div class="categories">
            <button class="category-btn active" data-filter="all">All</button>
            <button class="category-btn" data-filter="nature">Nature</button>
            <button class="category-btn" data-filter="city">City</button>
            <button class="category-btn" data-filter="people">People</button>
            <button class="category-btn" data-filter="animal">Animals</button>
            <button class="category-btn" data-filter="travel">Travel</button>
        </div>
    </header>

    <div class="gallery-container">
        <div class="gallery" id="gallery">
            <!-- Nature -->
            <a href="https://source.unsplash.com/random/800x600?nature" data-lightbox="gallery" data-title="Nature View" class="item nature">
                <img src="https://source.unsplash.com/random/400x300?nature" alt="Nature">
            </a>
            <a href="https://source.unsplash.com/random/800x600?mountain" data-lightbox="gallery" data-title="Mountains" class="item nature">
                <img src="https://source.unsplash.com/random/400x300?mountain" alt="Mountain">
            </a>

            <!-- City -->
            <a href="https://source.unsplash.com/random/800x600?city" data-lightbox="gallery" data-title="City Life" class="item city">
                <img src="https://source.unsplash.com/random/400x300?city" alt="City">
            </a>
            <a href="https://source.unsplash.com/random/800x600?architecture" data-lightbox="gallery" data-title="Architecture" class="item city">
                <img src="https://source.unsplash.com/random/400x300?architecture" alt="Architecture">
            </a>

            <!-- People -->
            <a href="https://source.unsplash.com/random/800x600?people" data-lightbox="gallery" data-title="People" class="item people">
                <img src="https://source.unsplash.com/random/400x300?people" alt="People">
            </a>
            <a href="https://source.unsplash.com/random/800x600?portrait" data-lightbox="gallery" data-title="Portrait" class="item people">
                <img src="https://source.unsplash.com/random/400x300?portrait" alt="Portrait">
            </a>

            <!-- Animals -->
            <a href="https://source.unsplash.com/random/800x600?animal" data-lightbox="gallery" class="item animal">
                <img src="https://source.unsplash.com/random/400x300?animal" alt="Animal">
            </a>
            <a href="https://source.unsplash.com/random/800x600?dog" data-lightbox="gallery" class="item animal">
                <img src="https://source.unsplash.com/random/400x300?dog" alt="Dog">
            </a>

            <!-- Travel -->
            <a href="https://source.unsplash.com/random/800x600?travel" data-lightbox="gallery" class="item travel">
                <img src="https://source.unsplash.com/random/400x300?travel" alt="Travel">
            </a>
            <a href="https://source.unsplash.com/random/800x600?beach" data-lightbox="gallery" class="item travel">
                <img src="https://source.unsplash.com/random/400x300?beach" alt="Beach">
            </a>
        </div>
    </div>

    <footer>
        <p>Made with ❤️ on GitHub Pages</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox-plus-jquery.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
