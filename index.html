<!DOCTYPE html>

<body class="dark-mode">
    <header>
        <h1>📸 My Photo Collection</h1>
        <p>Beautiful moments captured in time</p>
        
        <div class="theme-toggle">
            <i class="fas fa-moon"></i>
            <span class="toggle-switch"></span>
            <i class="fas fa-sun"></i>
        </div>

        <div class="upload-container">
            <label for="fileInput" class="upload-btn">
                <i class="fas fa-cloud-upload-alt"></i> Upload Photo
            </label>
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Search photos...">
        </div>

        <div class="categories">
            <button class="category-btn active" data-filter="all">All</button>
            <button class="category-btn" data-filter="nature">Nature</button>
            <button class="category-btn" data-filter="city">City</button>
            <button class="category-btn" data-filter="people">People</button>
            <button class="category-btn" data-filter="animal">Animals</button>
            <button class="category-btn" data-filter="travel">Travel</button>
        </div>
    </header>
